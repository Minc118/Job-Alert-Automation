<!--
Stitch dashboard prototype source of truth.

The full Stitch HTML was provided in the implementation prompt and includes:
- Overview page
- Jobs page
- Settings page
- Tailwind CDN config with Inter typography and Material Symbols
- surface/background/primary/secondary token system
- sidebar, topbar, cards, tables, drawer, badges, and settings sections

This project implements F1 by extracting the visible design system and layout structure
from that supplied prototype. The implemented docs/design-system-extracted.md records the
tokens and components used by the React/Tailwind conversion.
-->
