services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    working_dir: /app/backend
    env_file:
      - path: .env
        required: false
    volumes:
      - ./secrets:/app/secrets
      - ./output:/app/output
      - ./private:/app/private
    stdin_open: true
    tty: true

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    working_dir: /app/backend
    command: uvicorn api.app:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - path: .env
        required: false
    volumes:
      - ./backend/api:/app/backend/api
      - ./backend/job_alert_automation:/app/backend/job_alert_automation
      - ./backend/config:/app/backend/config
      - ./backend/migrations:/app/backend/migrations
      - ./secrets:/app/secrets
      - ./output:/app/output
      - ./private:/app/private
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    working_dir: /app/frontend
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_MODE: ${VITE_API_MODE:-real}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      VITE_AUTH_MODE: ${VITE_AUTH_MODE:-mock}
      VITE_NEON_AUTH_URL: ${VITE_NEON_AUTH_URL:-}
    volumes:
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  frontend_node_modules:
